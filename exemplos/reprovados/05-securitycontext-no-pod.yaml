# espera: 3.2
# O bloco da 3.2 copiado do wiki como esta, no nivel do Pod. Parece certo, e
# o apiserver recusa: tres dos campos so existem no container (achado 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations: {metacortex.io/owner: time-nyx, metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      securityContext:                  # copiado do wiki, regra 3.2
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      containers:
        - name: api
          image: registry.metacortex.io/nyx/api:2.9.1
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
