# 1.2 — namespace no formato <cliente>-<ambiente>.
# Pod Security "restricted" faz o proprio cluster recusar o que o Bloco 3
# proibe (root, privileged, hostNetwork/hostPID, capabilities extras).
# Atencao: a recusa acontece na criacao do Pod, nao do Deployment — ver
# docs/revisao-do-padrao.md, achado 4.
apiVersion: v1
kind: Namespace
metadata:
  name: nyx-dev
  labels:
    app.kubernetes.io/name: nyx
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    metacortex.io/owner: time-nyx
