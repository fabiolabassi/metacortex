name: manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Desde a reorganizacao em desafio-03/, o trabalho original do padrao vive em
# ticket-01-padrao-de-manifests/trabalho-anterior e a skill em .../skill.
defaults:
  run:
    working-directory: desafio-03/ticket-01-padrao-de-manifests/trabalho-anterior

jobs:
  padrao:
    name: Padrao de Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: pip install --quiet pyyaml==6.0.2

      # Prova que o verificador continua pegando cada anti-padrao, e so ele.
      - name: Testes do verificador
        run: python3 -m unittest discover -s tests -v


      # Blocos 1, 2 e 3 — inclusive o que o Trivy nao conhece.
      - name: Padrao Metacortex
        run: python3 scripts/check_padrao.py --github manifests

      # Bloco 3 — varredura mantida por Seguranca & Compliance. Mesmo comando
      # do scripts/validate.sh, para CI e maquina local nao divergirem.
      - name: Instalar Trivy
        # Fixado por SHA (v0.3.1): tag de action pode ser movida; commit nao.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.74.0   # mesma versao usada na revisao do padrao

      - name: Trivy config
        run: |
          trivy config --exit-code 1 \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --config .trivy/trivy.yaml \
            --ignorefile .trivyignore.yaml \
            manifests

      # Mesmo criterio para o script empacotado na skill (precisa do Trivy).
      - name: Testes do script da skill
        working-directory: desafio-03/ticket-01-padrao-de-manifests
        run: python3 -m unittest discover -s tests -v

  admissao:
    # O que analise estatica nao ve: schema estrito, validacao do apiserver e
    # Pod Security. Sobe um cluster kind e faz dry-run do lado do servidor.
    name: Admissao em cluster (kind)
    runs-on: ubuntu-latest
    needs: padrao
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: metacortex-ci
      - name: Namespaces
        run: for ns in manifests/*/00-namespace.yaml; do kubectl apply -f "$ns"; done
      - name: Dry-run do lado do servidor
        run: kubectl apply --dry-run=server -R -f manifests/
