#cloud-config
# construct-node-01: VM dentro do baseline v1.
users:
  - name: auditor
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - @CHAVE_PLATAFORMA@
disable_root: true
ssh_pwauth: false
package_update: true
packages: [chrony, containerd]
write_files:
  - path: /etc/ssh/sshd_config.d/10-metacortex.conf
    content: |
      PermitRootLogin no
  - path: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus node_exporter
      Wants=network-online.target
      After=network-online.target
      [Service]
      User=nobody
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=10.0.2.15:9100
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [sh, -c, 'cd /tmp && V=1.8.2 && curl -sfLO https://github.com/prometheus/node_exporter/releases/download/v$V/node_exporter-$V.linux-amd64.tar.gz && curl -sfLO https://github.com/prometheus/node_exporter/releases/download/v$V/sha256sums.txt && grep linux-amd64.tar.gz sha256sums.txt | sha256sum -c - && tar xzf node_exporter-$V.linux-amd64.tar.gz && install -m 0755 node_exporter-$V.linux-amd64/node_exporter /usr/local/bin/']
  - systemctl daemon-reload
  - systemctl enable --now node_exporter chrony containerd
  - systemctl restart ssh
  - touch /var/lib/cloud/roster-pronto
