# Laboratorio — NAO e workload do parque. Usa imagem publica (viola a 3.7 de
# proposito) para que os Pods subam de verdade num cluster descartavel (kind)
# e os comportamentos citados no wiki possam ser observados.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
