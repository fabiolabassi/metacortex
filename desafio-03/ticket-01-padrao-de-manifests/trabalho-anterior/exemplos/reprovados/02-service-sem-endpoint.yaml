# espera: 1.4
# O caso silencioso da 1.4: o apiserver aceita os dois Services, e nenhum
# deles entrega trafego. O Deployment esta correto de proposito — o erro mora
# so no Service. Reproduzido em cluster em lab/lab.sh (achado 3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations: {metacortex.io/owner: time-nyx, metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: registry.metacortex.io/nyx/api:2.9.1
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: nyx-api-seletor-errado
  namespace: nyx-dev
  labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations: {metacortex.io/owner: time-nyx}
spec:
  selector:
    app.kubernetes.io/name: nyxapi      # 1.4 o pod se chama nyx-api
    app.kubernetes.io/instance: nyx-dev
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: nyx-api-porta-errada
  namespace: nyx-dev
  labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations: {metacortex.io/owner: time-nyx}
spec:
  selector: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-dev}
  ports:
    - name: http
      port: 80
      targetPort: web                   # 4.5 o container chama a porta de "http"
