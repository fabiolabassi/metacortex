apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-nyx
    metacortex.io/runbook: https://runbooks.metacortex.io/nyx/api
spec:
  replicas: 1                      # dev; o sequelize.sync() roda a cada start (ver Decisões)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: nyx-api
      app.kubernetes.io/instance: nyx-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyx-api
        app.kubernetes.io/instance: nyx-dev
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30   # tini repassa o SIGTERM; node sem handler sai na hora
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nyx-api
              app.kubernetes.io/instance: nyx-dev
      containers:
        - name: api
          image: registry.metacortex.io/nyx/kube-news:v1   # espelho de fabricioveronez/kube-news:v1
          ports:
            - {name: http, containerPort: 8080}          # app.listen(8080) em src/server.js
          envFrom:
            - configMapRef: {name: nyx-api}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: nyx-db, key: password}
          resources:                      # chute inicial para Node/Express, sem medição
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:                 # /ready em src/system-life.js
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                  # /health não toca o banco
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
