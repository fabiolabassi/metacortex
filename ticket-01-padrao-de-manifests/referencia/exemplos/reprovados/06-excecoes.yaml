# espera: 2.3 3.1
# Processo de excecao (secao "Excecoes" do wiki) declarado no objeto:
#   nyx-api       excecao a 2.3 aprovada e dentro da validade -> vira AVISO
#   nyx-admin     excecao a 2.3 vencida                        -> continua ERRO
#   nyx-legado    "excecao" a 3.1, que e proibida              -> continua ERRO
# Os links de aprovacao sao ilustrativos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-api
  namespace: nyx-prod
  labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-prod, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations:
    metacortex.io/owner: time-nyx
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-api
    excecao.metacortex.io/2.3: "validade=2099-12-31; aprovacao=https://git.metacortex.io/nyx/pull/1"
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-prod}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nyx-api, app.kubernetes.io/instance: nyx-prod, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
    spec:
      serviceAccountName: nyx-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: registry.metacortex.io/nyx/api:2.9.1
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-admin
  namespace: nyx-prod
  labels: {app.kubernetes.io/name: nyx-admin, app.kubernetes.io/instance: nyx-prod, app.kubernetes.io/part-of: nyx, app.kubernetes.io/managed-by: platform}
  annotations:
    metacortex.io/owner: time-nyx
    metacortex.io/runbook: https://wiki.metacortex.io/runbooks/nyx-admin
    excecao.metacortex.io/2.3: "validade=2026-01-31; aprovacao=https://git.metacortex.io/nyx/pull/2"
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
