# 1.2 — namespace no formato <cliente>-<ambiente>.
# Pod Security restricted aplica as regras do Bloco 3 aos Pods do namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: nyx-dev
  labels:
    app.kubernetes.io/name: nyx
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    metacortex.io/owner: time-nyx
