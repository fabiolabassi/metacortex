# 3.5 — uma ServiceAccount por workload, sem nenhum RBAC: nenhum dos tres
# componentes conversa com o apiserver.
# 3.4 — automount desligado tambem na SA. Se um Pod futuro esquecer o campo
# no spec, ele herda o "false" daqui em vez do "true" implicito.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-nyx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-worker
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-worker
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-nyx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-reconcile
  namespace: nyx-prod
  labels:
    app.kubernetes.io/name: nyx-reconcile
    app.kubernetes.io/instance: nyx-prod
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-nyx
automountServiceAccountToken: false
