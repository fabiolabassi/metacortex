# Migração de esquema (flask db upgrade), tirada do entrypoint.sh da imagem para
# não rodar em cada réplica do Deployment. Aplicar e esperar concluir ANTES do
# 30-deployment:
#   kubectl -n orion-prod wait --for=condition=complete job/orion-fake-shop-migracao --timeout=5m
# spec.template de Job é imutável: a cada nova tag, apague o Job anterior
# (ou rode como hook PreSync do Argo CD / pre-upgrade do Helm).
apiVersion: batch/v1
kind: Job
metadata:
  name: orion-fake-shop-migracao
  namespace: orion-prod
  labels:
    app.kubernetes.io/name: orion-fake-shop-migracao
    app.kubernetes.io/instance: orion-prod
    app.kubernetes.io/part-of: orion
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: time-orion
    metacortex.io/runbook: https://runbooks.metacortex.io/orion/fake-shop
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-fake-shop-migracao
        app.kubernetes.io/instance: orion-prod
        app.kubernetes.io/part-of: orion
        app.kubernetes.io/managed-by: platform
    spec:
      restartPolicy: Never
      serviceAccountName: orion-fake-shop-migracao
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                  # usuário "app" da imagem (useradd --uid 10001)
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fake-shop-migracao
          image: registry.metacortex.io/orion/fake-shop:v1
          command: ["python", "-m", "flask", "db", "upgrade"]
          envFrom:
            - configMapRef: {name: orion-fake-shop}
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: orion-db, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: orion-db, key: password}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # index.py instancia GunicornPrometheusMetrics no import: o diretório
            # precisa existir também aqui, e o emptyDir em /tmp esconde o da imagem.
            - {name: metrics, mountPath: /tmp/metrics}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: metrics
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
