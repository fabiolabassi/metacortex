# Um Deployment correto e tres objetos que o apiserver aceita sem reclamar,
# mas que nao fazem nada: o caso silencioso da 1.4 e seus parentes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: lab-dev
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: lab-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lab-api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 2}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: lab-api, namespace: lab-dev}
spec:
  selector: {app.kubernetes.io/name: lab-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: lab-api-seletor-errado, namespace: lab-dev}
spec:
  selector: {app.kubernetes.io/name: labapi}          # um hifen a menos
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: lab-api-porta-errada, namespace: lab-dev}
spec:
  selector: {app.kubernetes.io/name: lab-api}
  ports: [{name: http, port: 80, targetPort: web}]    # o container chama de "http"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: lab-pdb-sem-alvo, namespace: lab-dev}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: labapi}     # mesmo erro, agora no PDB
