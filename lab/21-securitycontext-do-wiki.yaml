# Achados 1 e 2: o bloco da 3.2 exatamente como no wiki.
# (a) no nivel do Pod  -> recusado pelo apiserver (strict decoding)
# (b) no nivel do container, sem seccompProfile -> recusado pelo Pod Security
apiVersion: v1
kind: Pod
metadata: {name: lab-sc-nivel-pod, namespace: lab-dev}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  containers:
    - name: api
      image: nginxinc/nginx-unprivileged:1.27-alpine
---
apiVersion: v1
kind: Pod
metadata: {name: lab-sc-nivel-container, namespace: lab-dev}
spec:
  containers:
    - name: api
      image: nginxinc/nginx-unprivileged:1.27-alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
